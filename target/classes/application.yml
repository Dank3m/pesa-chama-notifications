server:
  port: 8081

webclient:
  connection:
    timeout-ms: 5000
  read:
    timeout-ms: 30000
  pool:
    max-connections: 500
    max-idle-time-ms: 20000
  ssl:
    trust-all: false  # Only for development!
  logging:
    enabled: true

spring:
  application:
    name: notification-service
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pesa_chama_notifications}
    username: ${DB_USERNAME:kinduberre}
    password: ${DB_PASSWORD:3xcu53m3}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    defer-datasource-initialization: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.tablebanking.notification.dto
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.tablebanking.notification.dto.NotificationEvent
    listener:
      concurrency: 3
      ack-mode: manual

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 5000ms

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
        transport:
          protocol: smtp

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    cache: false

# Notification Service Configuration
notification:
  # SMS Provider (Infobip)
  sms:
    enabled: ${SMS_ENABLED:false}
    provider: infobip
    infobip:
      base-url: ${INFOBIP_BASE_URL:https://api.infobip.com}
      api-key: ${INFOBIP_API_KEY:}
      sender-id: ${INFOBIP_SENDER_ID:TableBank}
    # Rate limiting
    rate-limit:
      max-per-minute: 60
      max-per-hour: 500
  
  # Email Configuration
  email:
    enabled: ${EMAIL_ENABLED:false}
    from-address: ${EMAIL_FROM:noreply@tablebanking.com}
    from-name: ${EMAIL_FROM_NAME:Table Banking}
  
  # Retry Configuration
  retry:
    max-attempts: 3
    initial-interval: 1000
    multiplier: 2.0
    max-interval: 10000
  
  # Deduplication
  deduplication:
    enabled: true
    ttl-minutes: 60
  
  # Templates
  templates:
    contribution-reminder: "Dear {memberName}, your monthly contribution of KES {amount} for {month} is due by {dueDate}. Please make payment to avoid penalties. - {groupName}"
    contribution-received: "Dear {memberName}, we have received your contribution of KES {amount} for {month}. Thank you! - {groupName}"
    contribution-overdue: "Dear {memberName}, your contribution of KES {amount} for {month} is overdue. Please pay immediately to avoid conversion to loan. - {groupName}"
    loan-approved: "Dear {memberName}, your loan of KES {amount} has been approved. It will be disbursed within 24 hours. - {groupName}"
    loan-disbursed: "Dear {memberName}, KES {amount} has been disbursed to your account. Repayment starts {startDate}. Outstanding: KES {outstanding}. - {groupName}"
    loan-payment-reminder: "Dear {memberName}, your loan payment of KES {amount} is due on {dueDate}. Outstanding balance: KES {outstanding}. - {groupName}"
    loan-payment-received: "Dear {memberName}, we received your loan payment of KES {amount}. Outstanding balance: KES {outstanding}. Thank you! - {groupName}"
    loan-overdue: "URGENT: Dear {memberName}, your loan payment is overdue. Outstanding: KES {outstanding}. Please pay immediately to avoid penalties. - {groupName}"
    default-converted: "Dear {memberName}, your unpaid contribution of KES {amount} has been converted to a loan with 10% monthly interest. - {groupName}"

# Kafka Topics
kafka:
  topics:
    notification-events: notification-events
    contribution-events: contribution-events
    loan-events: loan-events
    sms-delivery: sms-delivery-status
    email-delivery: email-delivery-status

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  health:
    kafka:
      enabled: true

# Logging
logging:
  level:
    root: INFO
    com.tablebanking.notification: DEBUG
    org.apache.kafka: WARN
    org.springframework.kafka: INFO

# OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
